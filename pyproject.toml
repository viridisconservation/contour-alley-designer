[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-alley-designer"
version = "0.6.0.dev0"
description = "Landscape-general agroforestry design: contour alleys, shelterbelts, silvopasture and savanna restoration, robustly optimized on real terrain"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Viridis LLC (Viridis Conservation)"}]

[tool.setuptools]
packages = ["contour"]
