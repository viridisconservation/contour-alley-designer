[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-alley-designer"
version = "0.6.3"
description = "Landscape-general agroforestry design: contour alleys, shelterbelts, silvopasture and savanna restoration, robustly optimized on real terrain"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Viridis LLC (Viridis Conservation)"}]

[project.scripts]
contour-alley-mcp = "contour.mcp_server:main"

[project.urls]
Homepage = "https://github.com/viridisconservation/contour-alley-designer"
Documentation = "https://github.com/viridisconservation/contour-alley-designer/blob/main/AGENTS.md"

[tool.setuptools]
packages = ["contour"]

[tool.setuptools.package-data]
# Filled at build time by setup.py (tools/bundle_mcp_data.py); never committed.
contour = ["_bundled/**/*"]
